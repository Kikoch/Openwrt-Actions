# PonWrt 构建用的 feeds 源, 与源码 pin (5651948f9d6e9aa48e22338d6abe650019988448,
# 2026-09-25) 同期固定。

# 为什么要固定:
#   feeds 默认跟着各仓库 HEAD 走。上游 packages/luci 滚动后依赖会超前于
#   已 pin 的源码, 表现不是报错, 而是旧配置里的符号被静默丢弃,
#   编译照样成功、固件却少了功能。固定到同期提交才能让每次构建可复现。

# 语法: src-git <name> <url>^<commit>
#   scripts/feeds 以 split(/\^/, $src) 解析, 先 clone 再 checkout 到该提交。

# 升级源码版本时, 必须同步更新这里的 feeds 提交。
# 不想用固定版本: workflow 手动运行时把 pin_feeds 设为 no。

# !! 本文件里绝对不能出现"只有 # 一个字符"的行 !!
#   scripts/feeds 的 parse_file 用 s/#.+$// 去注释, 要求 # 后至少有一个字符。
#   光是 # 不会被剥掉, 随后匹配 src-<type> <name> <url> 失败 -> die,
#   表现为 "Syntax error in feeds.conf.default, line N", feeds 退出码 25,
#   整个构建在前 3 分钟就挂掉。分隔只能用空行或"# 文字"。

src-git packages https://github.com/immortalwrt/packages.git^4a69a0b76759dcd6e2164c81d7260b5280d833c1
src-git luci https://github.com/immortalwrt/luci.git^f4f91aee257bab4eb9c6b7de6160cea294217956
src-git routing https://github.com/openwrt/routing.git^4b9891b9136259f93294a424507ed24c5e8c1cbd
src-git telephony https://github.com/openwrt/telephony.git^5d68d53c160a325ea9d03fce393e051573bcc736
src-git video https://github.com/openwrt/video.git^605d768782e13fc8b8fa16e719d4a2742dafbd45
src-git pon_drivers https://github.com/pbs05/openwrt-pon-drivers.git^e5194d2dfd169eef8f4a944fdc3f929e0287b680
src-git pon_userspace https://github.com/pbs05/openwrt-pon-userspace.git^8b9e99921e7380f6f117cf6464d903b2b76e48c6
# OpenClash 官方源 (run #16 产物里根本没有 openclash 的根因: luci feed 里没有这个
#   包, extra.config 写的 CONFIG_PACKAGE_luci-app-openclash=y 被 make defconfig
#   当作未知符号静默丢掉, 编译照样成功, 固件里却一个字节都没有)。
#   仓库根目录就是 luci-app-openclash/ 包目录, 直接 src-git 当 feed 用。
src-git openclash https://github.com/vernesong/OpenClash.git^c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593
