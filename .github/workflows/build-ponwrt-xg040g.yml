#=================================================
# Build PonWrt (Nokia XG-040G-MD UBI, 保留 PON 光口)
# 构建方法对齐 PonWrt 官方 CI (.github/workflows/release.yml):
#   kconfig.pl 合并 configs + make defconfig + make
# 源码 pin 到上游 master HEAD（2026-10-07 同步, 04986da1e, 2026-10-06）。
#   已含 usb-sfp 重构 (3cca3ed60) 与 EN8811H 复位时序主线修复 (69cd3e269,
#   与本地 diy-part1 的 lan1 修复同值 -> diy-part1 已做成幂等)。
#   历史已知良好版本: 5651948f9d (2026-09-25, usb-sfp 重构前)。
# feeds 同步 pin 到同期提交，保证可复现
# 编译后执行 scripts/verify-firmware.sh 做产物层校验
#=================================================

name: Build PonWrt XG-040G-MD

on:
  # 必须带 types: 裸 repository_dispatch 会被任意 event_type 命中,
  # 而 TR3000 那条线也这么写 -> 一次 dispatch 会同时把两条线拉起来。
  repository_dispatch:
    types: [build-ponwrt]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "PonWrt 源码 ref (留空=用默认 pin 的已知良好版本)"
        required: false
        default: ""
      pin_feeds:
        description: "固定 feeds 到与源码同期的提交 (yes/no)"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      skip_verify:
        description: "跳过产物层校验 (仅排障用, yes/no)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      release:
        description: "是否创建 Release (yes/no)"
        required: false
        default: "no"
  push:
    branches:
      - main
      - master
    paths:
      - "ponwrt-extra.config"
      - "ponwrt-diy-part1.sh"
      - "ponwrt-diy-part2.sh"
      - "ponwrt-feeds.conf"
      - "ponwrt-required-packages.txt"
      # 用本线专属入口, 不要写共用的 scripts/verify-firmware.sh:
      # paths 是 OR 语义, 共用文件会让改一次校验把 TR3000 线也拉起来
      # (它单次 3.5 小时)。
      - "scripts/verify-ponwrt.sh"

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  # 2026-10-07 同步上游 master HEAD (2026-10-06 15:17 UTC)。
  # 旧 pin 5651948f9d (2026-09-25) 落后 132 commits; f44d1535b4 (9/18) 依旧不能用。
  REPO_REF: 04986da1e63cf2c52521c1aa737ee5d59e05986d
  CONFIG_FILE: ponwrt-extra.config
  DIY_P1_SH: ponwrt-diy-part1.sh
  DIY_P2_SH: ponwrt-diy-part2.sh
  FEEDS_CONF: ponwrt-feeds.conf
  REQUIRED_PKGS: ponwrt-required-packages.txt
  # 产物层校验目标
  EXPECT_PROFILE: nokia_xg-040g-md-ubi
  EXPECT_BOARD: nokia,xg-040g-md-ubi
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

concurrency:
  # 新 push 直接取消未完成的旧构建: 配置类文件改得频繁, 避免几个 2 小时的
  # 构建串成一串队列、最后好几个都白跑。
  # 注意: 这会把正在跑的那次一起砍掉。要"排队等它跑完"而不是取消时
  #       (比如只是为了把改动落地、不想打断当前构建), 两个办法:
  #         1) 提交信息带 [skip ci] —— 完全不触发;
  #         2) 临时把下面这行改成 false —— 新 run 会 pending 排队, 跑完再动手。
  group: ponwrt-xg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 想换更大的 runner 不用改文件: 仓库 Settings → Variables → Actions 新建变量
    # PONWRT_RUNNER, 值填你那边 larger runner 的 label。不建就是默认的 4 vCPU
    # ubuntu-24.04 —— 单次编译约 3.5 小时(实测 198~230 分钟), 换 16 核大约 1 小时。
    runs-on: ${{ vars.PONWRT_RUNNER || 'ubuntu-24.04' }}
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Free build space
      # 标准 runner 只有 14 GB 盘, 而带 DEBUG_INFO 的完整构建很容易把盘压到底 ——
      # 见底不是"报错", 是 I/O 抖动, 表现出来就是"莫名其妙变慢"。这里多腾几 GB,
      # 并在前后各打一次 df, 事后能判断是不是磁盘的锅。
      run: |
        df -hT /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/share/swift /opt/hostedtoolcache /usr/local/share/boost \
                    /opt/az /usr/local/.ghcup
        sudo apt-get clean
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -hT /

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone PonWrt source code (pinned)
      working-directory: /workdir
      run: |
        df -hT $PWD
        REF="${{ github.event.inputs.source_ref }}"
        [ -z "$REF" ] && REF="$REPO_REF"
        echo "Building from: $REF"
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout -q $REF
        echo "SOURCE_REF=$REF" >> $GITHUB_ENV
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache downloads (dl/)
      # 缓存已下载的软件包源码，重复构建可省掉数 GB 重复下载。
      # key 只用 feeds.conf: dl/ 里装的是源码 tarball, 内容只由 feeds 的 pin 决定,
      # 跟 extra.config / diy-part2.sh 无关。以前把这两个也算进 key, 结果每改一次
      # 包选择就换 key -> 全量重存几 GB, 还把别的缓存挤掉。
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        key: ponwrt-dl-${{ hashFiles('ponwrt-feeds.conf') }}
        restore-keys: |
          ponwrt-dl-

    - name: Cache ccache
      # 配合 ponwrt-extra.config 里的 CONFIG_CCACHE=y。OpenWrt 的 CCACHE_DIR 默认落在
      # $(TOPDIR)/.ccache = /workdir/openwrt/.ccache。
      # 这是跨构建复用 C 编译结果的唯一手段 —— 只缓存 dl/ 的话, 工具链和几百个包
      # 每次都要从零编, 3.5 小时里绝大部分就耗在这。首次要多编一个 tools/ccache 4.13.3。
      # 注意 GitHub 缓存总配额 10 GB/仓库, 要和 dl/ (以及 TR3000 那条线) 一起算账。
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/.ccache
        key: ponwrt-ccache-${{ hashFiles('ponwrt-feeds.conf', 'ponwrt-extra.config', 'ponwrt-diy-part2.sh') }}
        restore-keys: |
          ponwrt-ccache-

    - name: Load custom feeds (pinned)
      run: |
        # pin_feeds=no 时不覆盖，沿用源码自带 feeds.conf.default (跟随上游 HEAD)
        if [ "${{ github.event.inputs.pin_feeds }}" != "no" ] && [ -e "$FEEDS_CONF" ]; then
          echo "使用固定 feeds: $FEEDS_CONF"
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
        else
          echo "pin_feeds=no，使用源码自带 feeds.conf.default"
        fi
        # 语法预检: scripts/feeds 的 parse_file 用 s/#.+$// 去注释, 要求 # 后
        # 至少有一个字符。只有 # 的行不会被剥掉, 随后匹配 src-<type> 失败并 die
        # (退出码 25), 构建会在前三分钟挂掉且报错很隐晦。这里提前拦住。
        if grep -nE '^#[[:space:]]*$' openwrt/feeds.conf.default; then
          echo "FATAL: feeds.conf.default 含只有 # 的行, scripts/feeds 会解析失败 (exit 25)"
          exit 1
        fi
        awk '!/^[[:space:]]*#/ && NF {print "  " $0}' openwrt/feeds.conf.default | head -20

    - name: Run DIY part1 (自定义前置脚本)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load configuration (官方 kconfig 合并 + 附加包)
      # 显式 shell: bash —— 既拿回 pipefail (默认的 `bash -e {0}` 没有, 失败会被吞掉),
      # 也才能在下面用 `脚本 | tee` 判退出码。
      #
      # 失败时把脚本输出抬成 ::error:: 注解, 这是**故意的**:
      #   GitHub 的完整 job 日志要 admin 权限 (匿名 API 403, 网页也要求登录),
      #   而**注解是公开可读的** (匿名读 check-run 的 /annotations 就能拿到)。
      #   没有注解, 配置阶段的失败就只能靠人肉贴日志, 排障效率差一个数量级。
      #   注解里换行必须编码成 %0A, % 本身要先转义成 %25。
      shell: bash
      run: |
        if [ -e files ]; then mv files openwrt/files; fi
        chmod +x $DIY_P2_SH
        cd openwrt
        LOG=/tmp/diy-part2.log
        if "$GITHUB_WORKSPACE/$DIY_P2_SH" 2>&1 | tee "$LOG"; then
          exit 0
        fi
        esc() { local s="${1//%/%25}"; printf '%s' "${s//$'\n'/%0A}"; }
        NL=$'\n'
        FATALS="$(grep -aE '^FATAL' "$LOG" | sort -u || true)"
        [ -n "$FATALS" ] && echo "::error::$(esc "配置阶段失败原因:${NL}${FATALS}")"
        # 无论哪条断言炸, 都把相关符号的**真实值**一并报出来 —— 免得再来一轮
        EV="$(grep -aE 'shellsync|kmod-macvlan|luci-app-iptv|iptv-zh-cn|kmod-mppe|ovpn-backports|KERNEL_DEBUG_INFO|CCACHE|CONFIG_DEVEL' .config | sort -u || true)"
        echo "::error::$(esc "defconfig 之后的相关符号实况:${NL}${EV}")"
        echo "::error::$(esc "脚本末尾 30 行:${NL}$(tail -30 "$LOG")")"
        exit 1

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      # 必须显式写 shell: bash —— Linux 上的默认 shell 是 `bash -e {0}`, 不含 pipefail,
      # 于是 `make … | tee "$LOG"` 的退出码等于 tee 的（恒 0）, make 失败会被判成 success。
      # run #23 就是这么"假成功"的: 编译 30.6 分钟死在内核补丁上, 步骤报 success,
      # 一直到 verify 的源码断言才发现。写明 shell: bash 才会加 -o pipefail。
      shell: bash
      env:
        # --- ccache（配合 ponwrt-extra.config 的 CONFIG_CCACHE=y）---
        # rules.mk 自己会 export CCACHE_BASEDIR / CCACHE_NOCOMPRESS, 这里只补它没设的。
        CCACHE_DIR: /workdir/openwrt/.ccache
        CCACHE_MAXSIZE: 1500M
        # ccache 默认 compiler_check=mtime: 每次重新编出来的工具链 mtime 都不一样 -> 全 miss。
        # 按内容比对, 跨构建才有机会命中。
        CCACHE_COMPILERCHECK: content
      run: |
        cd openwrt
        JOBS=$(( $(nproc) + 1 ))
        echo "$(nproc) vCPU -> make -j$JOBS"
        LOG=/tmp/openwrt-build.log
        : > "$LOG"
        ts() { date -u '+%H:%M:%S'; }
        df -hT / | tail -1

        rc=0
        echo "### [$(ts)] make -j$JOBS 开始"
        if make -j"$JOBS" 2>&1 | tee "$LOG"; then
          echo "### [$(ts)] make 一次通过"
        else
          # 以前这里接着 `make -j1` 做全树串行兜底 —— 那等于把剩下的活儿全部单核串行化,
          # 失败点稍微靠前一点, 30 分钟就能变成 3 小时。改成: 从日志抓出失败的包, 定点重编。
          echo "### [$(ts)] make -j$JOBS 失败, 转入定点重编"
          FAILED="$(grep -oE 'package/[^ ]+ failed to build' "$LOG" | sed 's/ failed to build//' | sort -u || true)"
          if [ -z "$FAILED" ]; then
            echo "### 日志里没抓到 'failed to build', 原样重试一次"
            make -j"$JOBS" 2>&1 | tee -a "$LOG" || rc=$?
          else
            echo "### 失败包: $(printf '%s ' $FAILED)"
            for p in $FAILED; do
              echo "### [$(ts)] 定点重编 $p"
              make "$p/compile" V=s -j1 2>&1 | tee -a "$LOG" \
                || echo "### $p 定点重编未通过, 先跑完剩余目标再定论"
            done
            echo "### [$(ts)] 定点重编结束, 补完剩余目标"
            make -j"$JOBS" 2>&1 | tee -a "$LOG" || rc=$?
          fi
        fi

        if [ "$rc" -ne 0 ]; then
          echo "### [$(ts)] 编译最终失败"
          # 诊断代码是"尽力而为", 别让刚拿到的 pipefail 把诊断自己打断
          set +e
          echo "===== 编译失败: 摘要 ====="
          # OpenWrt 的失败行形如 "    ERROR: package/feeds/packages/yq failed to build."
          grep -E '^[[:space:]]*ERROR: package/.* failed to build' "$LOG" | sort -u | while IFS= read -r line; do
            echo "::error::${line#*ERROR: }"
          done
          # 再给几条上下文: 真正的报错原因通常在失败行前面几十行
          echo "===== 失败包附近的报错 (去重后至多 30 行) ====="
          grep -nE '^[[:space:]]*ERROR: package/.* failed to build' "$LOG" | tail -1 | cut -d: -f1 | {
            IFS= read -r ln && awk -v ln="$ln" 'NR>=ln-60 && NR<=ln' "$LOG"
          } | grep -E 'Error [0-9]+|No such|No required|no required|failed|cannot find|Permission denied|go get ' | sort -u | head -30
          echo "===== 日志最后 150 行 ====="
          tail -150 "$LOG"
          exit 1
        fi
        echo "### [$(ts)] 编译完成"
        df -hT / | tail -1
        echo "--- ccache 统计 (cache hit 低就说明这套没在起作用) ---"
        ccache -s 2>/dev/null || true
        # DEVICE_NAME 必须是单行。多行写进 $GITHUB_ENV 会被 runner 拒绝:
        #   "Invalid format '<第二行>'" + "Unable to process file command 'env'"
        # 并且会直接把整个编译步骤判成失败 (run #15 就是这么挂的,
        # 后面 Verify / 上传 / Release 全被 skipped)。
        # 优先取期望的 profile, 取不到再退回第一个; 一个都没有时退回 EXPECT_PROFILE,
        # 不要在这里 exit —— 已经编了 3.5 小时, 别因为取名失败把产物丢掉。
        DEVICE_LIST="$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config 2>/dev/null | sed -r 's/.*DEVICE_(.*)=y/\1/' | sort -u || true)"
        DEVICE_OUT=""
        if printf '%s\n' "$DEVICE_LIST" | grep -qx '${{ env.EXPECT_PROFILE }}'; then
          DEVICE_OUT='${{ env.EXPECT_PROFILE }}'
        else
          DEVICE_OUT="$(printf '%s\n' "$DEVICE_LIST" | head -1)"
        fi
        if [ -z "$DEVICE_OUT" ]; then
          echo "::warning::.config 里没有 CONFIG_TARGET.*DEVICE.*=y, 退回 EXPECT_PROFILE"
          DEVICE_OUT='${{ env.EXPECT_PROFILE }}'
        fi
        echo "构建设备: $DEVICE_OUT (全部命中: $(printf '%s' "$DEVICE_LIST" | tr '\n' ' '))"
        echo "DEVICE_NAME=$DEVICE_OUT" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Verify firmware (产物层校验 + 归档)
      id: verify
      if: github.event.inputs.skip_verify != 'yes'
      env:
        SRC_DIR: openwrt
        EXPECT_PROFILE: ${{ env.EXPECT_PROFILE }}
        EXPECT_BOARD: ${{ env.EXPECT_BOARD }}
        REQUIRED_PKGS: ${{ env.REQUIRED_PKGS }}
        # 官方 configs/release.config 自带 luci-app-upnp, 已在 extra.config 里
        # 反向覆盖; 这里在产物层再卡一道, 防止依赖链把它 select 回来。
        # 后半段是 2026-10-06 砍掉的包 —— **只能列真的砍得掉的**:
        #   luci-app-iptv(+i18n) 无人 select; kmod-ovpn-backports 的上游 select 源
        #   (openvpn) 未启用。两者实测已成功关闭。
        #   注意**不要**把 shellsync / kmod-macvlan / kmod-mppe 放进来:
        #   它们是 ppp 的硬依赖 (Package/ppp DEPENDS:= ... +shellsync +kmod-mppe,
        #   Package/shellsync 又依赖 +kmod-macvlan), 而 ppp 在
        #   include/target.mk 的 DEFAULT_PACKAGES.router 里 -> 一定在产物中。
        #   放进来会让 verify 步骤必然失败 (run #26 的教训)。
        # 2026-10-08 追加: 除 bootstrap 外的 5 个主题一律禁止出现在产物里。
        #   需求是"移除其余主题文件, 仅保留 bootstrap"。.config 层已在
        #   ponwrt-extra.config 反向覆盖 + ponwrt-diy-part2.sh 硬断言,
        #   这里做产物层第三道 —— 主题包是真的会进 manifest 的,
        #   任何一路被 select 顶回来都会在这里判死。
        FORBID_PKGS: "luci-app-upnp luci-i18n-upnp-zh-cn miniupnpd-nftables miniupnpd-iptables luci-app-iptv luci-i18n-iptv-zh-cn kmod-ovpn-backports luci-theme-argon luci-theme-footstrap luci-theme-material luci-theme-openwrt luci-theme-openwrt-2020"
        SOURCE_URL: ${{ env.REPO_URL }}
        SOURCE_REF: ${{ env.SOURCE_REF }}
      run: bash scripts/verify-ponwrt.sh

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      # 必须挂 compile 成功: 只用 !cancelled() 的话, 前面步骤失败后这步照样跑,
      # cd 进不存在的产物目录 -> 再报一个 exit 1, 把真正的失败原因埋掉
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outcome == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled() && (github.event.inputs.skip_verify == 'yes' || steps.verify.outcome == 'success')
      with:
        name: PonWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Create release
      if: github.event.inputs.release == 'yes' && !cancelled() && (github.event.inputs.skip_verify == 'yes' || steps.verify.outcome == 'success')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: PonWrt_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          PonWrt 云编译固件 - Nokia XG-040G-MD (UBI)
          源码: pbs05/ponwrt @ ${{ env.SOURCE_REF }}
          feeds: 固定到与源码同期的提交 (明细见产物内 build-info.txt)
          编译时间: ${{ env.FILE_DATE }}
          含完整 PON 光口支持 (XG-PON)
          已通过产物校验: profile ${{ env.EXPECT_PROFILE }} / 板名 ${{ env.EXPECT_BOARD }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: github.event.inputs.release == 'yes' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
