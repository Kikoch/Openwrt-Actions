#=================================================
# Build PonWrt (Nokia XG-040G-MD UBI, 保留 PON 光口)
# 模板参考: https://github.com/P3TERX/Actions-OpenWrt
# 源码: https://github.com/pbs05/ponwrt (ImmortalWrt + Airoha PON)
#=================================================

name: Build PonWrt XG-040G-MD

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      release:
        description: "是否创建 Release (yes/no)"
        required: false
        default: "no"
  push:
    branches:
      - main
      - master
    paths:
      - "ponwrt-extra.config"
      - "ponwrt-diy-part1.sh"
      - "ponwrt-diy-part2.sh"
  # schedule:
  #   - cron: 0 18 * * 5

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  BASE_CONFIG: configs/an7581.config
  CONFIG_FILE: ponwrt-extra.config
  DIY_P1_SH: ponwrt-diy-part1.sh
  DIY_P2_SH: ponwrt-diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone PonWrt source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Run DIY part1 (自定义前置脚本)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration (基础配置 + 附加包)
      run: |
        [ -e files ] && mv files openwrt/files
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_BIN_DIR == 'true' && !cancelled()
      with:
        name: PonWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      with:
        name: PonWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Create release
      if: github.event.inputs.release == 'yes' && !cancelled()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: PonWrt_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          PonWrt 云编译固件 - Nokia XG-040G-MD (UBI)
          源码: pbs05/ponwrt (${{ env.REPO_BRANCH }})
          编译时间: ${{ env.FILE_DATE }}
          含完整 PON 光口支持 (XG-PON)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
