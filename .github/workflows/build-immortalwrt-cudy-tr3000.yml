#=================================================
# Build ImmortalWrt 稳定版 (Cudy TR3000, 含 QModem 套件)
# 模板参考: https://github.com/P3TERX/Actions-OpenWrt
# 源码: https://github.com/ImmortalWrt/ImmortalWrt 稳定分支
#       (自动探测最新 openwrt-YY.MM, 无更新时跳过编译)
# QModem: https://github.com/FUjr/QModem
#
# 触发方式:
#   - 每日定时探测上游稳定分支, 有新提交才编译 (schedule)
#   - push 修改 cudy-tr3000-extra.config / cudy-tr3000-diy-part2.sh
#   - 手动 workflow_dispatch (可强制 release)
# 已编译版本记录: cudy-tr3000.last-built-ref (编译成功后自动回写)
#=================================================

name: Build ImmortalWrt Cudy TR3000

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      release:
        description: "是否创建 Release (yes/no)"
        required: false
        default: "no"
      force:
        description: "跳过上游更新检查, 强制编译 (yes/no)"
        required: false
        default: "no"
      profile:
        description: "设备 profile (一次构建只出一个 profile)"
        required: false
        default: "cudy_tr3000-v1"
        type: choice
        options:
          - cudy_tr3000-v1
          - cudy_tr3000-256mb-v1
          - cudy_tr3000-v1-ubootmod
  push:
    branches:
      - main
      - master
    paths:
      - "cudy-tr3000-extra.config"
      - "cudy-tr3000-diy-part2.sh"
  schedule:
    # UTC 21:30 = 北京时间 05:30, 每日探测一次上游稳定分支
    - cron: "30 21 * * *"

permissions:
  contents: write

env:
  REPO_URL: https://github.com/ImmortalWrt/ImmortalWrt
  QMODEM_URL: https://github.com/FUjr/QModem.git
  CONFIG_FILE: cudy-tr3000-extra.config
  DIY_P2_SH: cudy-tr3000-diy-part2.sh
  LAST_REF_FILE: cudy-tr3000.last-built-ref
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  check:
    name: Check upstream stable update
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.repository.owner.id == github.event.sender.id
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      branch: ${{ steps.check.outputs.branch }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Resolve latest stable branch & compare last built ref
      id: check
      run: |
        # 自动探测最新稳定分支 openwrt-YY.MM (版本号最大者)
        LATEST_BRANCH=$(git ls-remote --heads "$REPO_URL" 'openwrt-*' \
          | awk -F'/' '{print $NF}' \
          | grep -E '^openwrt-[0-9]{2}\.[0-9]+$' \
          | sort -rV | head -1)
        [ -n "$LATEST_BRANCH" ] || { echo "FATAL: 未探测到稳定分支"; exit 1; }
        UPSTREAM_SHA=$(git ls-remote "$REPO_URL" "$LATEST_BRANCH" | awk '{print $1}')
        LAST=$(cat "$LAST_REF_FILE" 2>/dev/null || echo "")
        echo "上游最新稳定: $LATEST_BRANCH @ ${UPSTREAM_SHA:0:12}"
        echo "上次已编译:   ${LAST:-<无记录>}"

        echo "branch=$LATEST_BRANCH" >> "$GITHUB_OUTPUT"
        echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

        # 非定时触发 (push / 手动 / repository_dispatch): 直接编译
        if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "非定时触发, 直接编译"
        elif [ "$LAST" = "${LATEST_BRANCH}@${UPSTREAM_SHA}" ]; then
          echo "should_build=false" >> "$GITHUB_OUTPUT"
          echo "上游无更新, 跳过编译"
        else
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "上游有更新, 开始编译"
        fi

  build:
    name: Build firmware
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Resolve build branch
      run: echo "REPO_BRANCH=${{ needs.check.outputs.branch }}" >> "$GITHUB_ENV"

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        echo "SOURCE_SHA=$(cd openwrt && git rev-parse HEAD)" >> "$GITHUB_ENV"
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Clone QModem source (拉取 QModem)
      working-directory: /workdir
      run: git clone --depth 1 $QMODEM_URL qmodem

    - name: Register QModem feed & update feeds
      run: |
        cd openwrt
        echo "src-link qmodem /workdir/qmodem" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds install -a -p qmodem

    - name: Load custom configuration (设备 + QModem 套件)
      env:
        # 非手动触发时为空, diy-part2.sh 回退到原厂分区布局 cudy_tr3000-v1
        PROFILE: ${{ github.event.inputs.profile }}
      run: |
        [ -e files ] && mv files openwrt/files
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(head -1 DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_BIN_DIR == 'true' && !cancelled()
      with:
        name: ImmortalWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      with:
        name: ImmortalWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Create release
      if: github.event.inputs.release == 'yes' && !cancelled()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ImmortalWrt_CudyTR3000_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ImmortalWrt ${{ env.REPO_BRANCH }} 云编译固件 - Cudy TR3000
          上游 commit: ${{ env.SOURCE_SHA }}
          含 QModem 模组管理套件 (luci-app-qmodem / qmodem / tom_modem / quectel-CM-5G-M)
          编译时间: ${{ env.FILE_DATE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update last-built ref (记录已编译的上游版本)
      if: success() && github.event_name == 'schedule'
      run: |
        REF="${{ needs.check.outputs.branch }}@${{ needs.check.outputs.sha }}"
        echo "$REF" > "$LAST_REF_FILE"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$LAST_REF_FILE"
        git commit -m "chore(tr3000): auto-build ref $REF [skip ci]"
        git push
        echo "已回写 $LAST_REF_FILE = $REF"
