name: Build QModem

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/
  SDK_PREFIX: openwrt-sdk-25.12.5-mediatek-filogic_
  SDK_EXT: tar.zst
  SDK_ARCH: aarch64_cortex-a53
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils zstd libelf-dev
          sudo apt-get clean

      - name: Download SDK
        run: |
          SDK_FILE=$(curl -sL $SDK_URL | grep -oP "${SDK_PREFIX}[^\"]*\.${SDK_EXT}" | head -1)
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          echo "Downloading $SDK_URL$SDK_FILE ..."
          wget -q "$SDK_URL$SDK_FILE"
          mkdir -p openwrt-sdk
          tar --zstd -xf "$SDK_FILE" -C openwrt-sdk --strip-components=1
          SDK_DIR=$GITHUB_WORKSPACE/openwrt-sdk
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      - name: Clone QModem Source
        run: |
          git clone --depth 1 https://github.com/FUjr/QModem.git qmodem-src
          echo "=== QModem source cloned ==="
          ls -la qmodem-src/

      - name: Configure Feeds
        run: |
          cd $SDK_DIR
          cat > feeds.conf <<EOF
          src-git base https://github.com/openwrt/openwrt.git;openwrt-25.12
          src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
          src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12
          src-git qmodem file://$GITHUB_WORKSPACE/qmodem-src
          EOF
          echo "=== feeds.conf ==="
          cat feeds.conf
          echo "=== Updating feeds ==="
          ./scripts/feeds update -a
          echo "=== Installing all feeds ==="
          ./scripts/feeds install -a

      - name: Configure Build
        run: |
          cd $SDK_DIR
          cat >> .config <<EOF
          CONFIG_PACKAGE_qmodem=m
          CONFIG_PACKAGE_luci-app-qmodem=m
          CONFIG_PACKAGE_luci-app-qmodem-sms=m
          CONFIG_PACKAGE_luci-i18n-qmodem-zh-cn=m
          CONFIG_PACKAGE_luci-i18n-qmodem-sms-zh-cn=m
          CONFIG_SIGNED_PACKAGES=n
          EOF
          make defconfig

      - name: Compile All QModem Packages
        run: |
          cd $SDK_DIR
          echo "=== Available qmodem feed packages ==="
          ls -la package/feeds/qmodem/ || echo "No qmodem feed packages found"
          for pkg_dir in package/feeds/qmodem/*/; do
            pkg_name=$(basename "$pkg_dir")
            echo ""
            echo "========================================"
            echo "=== Compiling: $pkg_name ==="
            echo "========================================"
            make package/$pkg_name/compile V=s -j$(nproc) || make package/$pkg_name/compile V=s -j1 || true
          done

      - name: Organize Files
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware
          find $SDK_DIR/bin/packages -name "*qmodem*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find $SDK_DIR/bin/targets -name "*qmodem*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          cd $GITHUB_WORKSPACE/firmware
          echo "=== Generated packages ==="
          ls -lh
          echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
        id: organize

      - name: Upload Artifact
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: QModem-APK-${{ env.SDK_ARCH }}
          path: ${{ steps.organize.outputs.FIRMWARE }}
