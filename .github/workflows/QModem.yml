name: Build QModem

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/
  SDK_PREFIX: openwrt-sdk-25.12.5-mediatek-filogic_
  SDK_EXT: tar.zst
  SDK_ARCH: aarch64_cortex-a53
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
            python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Download SDK
        run: |
          SDK_FILE=$(curl -sL $SDK_URL | grep -oP "${SDK_PREFIX}[^\"]*\.${SDK_EXT}" | head -1)
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          echo "Downloading $SDK_URL$SDK_FILE ..."
          wget -q "$SDK_URL$SDK_FILE"
          mkdir -p sdk
          tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          SDK_DIR=$GITHUB_WORKSPACE/sdk
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      - name: Clone QModem Source
        run: |
          git clone --depth 1 https://github.com/FUjr/QModem.git qmodem

      - name: Configure Feeds
        run: |
          cd $SDK_DIR
          # Step 1: Set up standard feeds
          echo "src-git base https://github.com/openwrt/openwrt.git;openwrt-25.12" > feeds.conf
          echo "src-git packages https://github.com/openwrt/packages.git;openwrt-25.12" >> feeds.conf
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-25.12" >> feeds.conf
          echo "src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Step 2: Register QModem as a feed via src-link
          echo "src-link qmodem $GITHUB_WORKSPACE/qmodem" >> feeds.conf
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

      - name: Configure Build
        run: |
          cd $SDK_DIR
          # Initial config (same as official CI)
          cat >> .config <<EOF
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_SIGNED_PACKAGES=n
          EOF
          # Official package config (from openwrt_package.config)
          cat >> .config <<EOF
          CONFIG_PACKAGE_luci-app-qmodem=m
          CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y
          CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_generic-qmi-wwan=y
          CONFIG_PACKAGE_luci-app-qmodem-sms=m
          CONFIG_PACKAGE_luci-i18n-qmodem-ru=m
          CONFIG_PACKAGE_luci-i18n-qmodem-sms-zh-cn=m
          CONFIG_PACKAGE_luci-i18n-qmodem-zh-cn=m
          CONFIG_PACKAGE_tom_modem=m
          CONFIG_PACKAGE_tom_modem_EARLY_RETURN=y
          CONFIG_PACKAGE_tom_modem_ENABLE_UBUS_DAEMON=y
          CONFIG_PACKAGE_quectel-CM-5G-M=m
          CONFIG_PACKAGE_qmodem=m
          CONFIG_PACKAGE_ubus-at-daemon=m
          EOF
          make defconfig

      - name: Compile QModem Packages
        run: |
          cd $SDK_DIR
          # Refresh feeds before compile
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

          # Compile generic (architecture-independent) packages
          for package in luci-app-qmodem luci-app-qmodem-sms luci-app-qmodem-next qmodem; do
            echo "========================================"
            echo "=== Compiling (generic): $package ==="
            echo "========================================"
            make package/$package/compile -j$(nproc) || true
          done

          # Compile architecture-specific packages
          for package in tom_modem quectel-CM-5G-M ubus-at-daemon sms_forwarder; do
            echo "========================================"
            echo "=== Compiling (arch): $package ==="
            echo "========================================"
            make package/$package/compile -j$(nproc) || true
          done

          echo "=== Compiled packages ==="
          ls -la bin/packages/${{ env.SDK_ARCH }}/qmodem/ 2>/dev/null || echo "No qmodem packages found"

      - name: Organize Files
        id: organize
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware
          # Collect all APKs from the qmodem package directory
          PKG_DIR=$SDK_DIR/bin/packages/${{ env.SDK_ARCH }}/qmodem
          if [ -d "$PKG_DIR" ]; then
            cp $PKG_DIR/*.apk $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          fi
          # Also search in case packages are in other locations
          find $SDK_DIR/bin/packages -name "*qmodem*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find $SDK_DIR/bin/packages -name "*tom_modem*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find $SDK_DIR/bin/packages -name "*ubus-at-daemon*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find $SDK_DIR/bin/packages -name "*sms_forwarder*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find $SDK_DIR/bin/packages -name "*quectel-CM*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find $SDK_DIR/bin/packages -name "*luci-i18n-qmodem*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true

          cd $GITHUB_WORKSPACE/firmware
          echo "=== Generated APK packages ==="
          ls -lh
          echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: QModem-arm64_apk
          path: ${{ steps.organize.outputs.FIRMWARE }}
