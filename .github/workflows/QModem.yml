#=================================================
# Build QModem for Cudy TR3000-v1
# Target: OpenWrt 25.12.5 / mediatek/filogic / APK
# Based on: P3TERX/Actions-OpenWrt workflow style
#=================================================

name: Build QModem

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  pull_request:
    branches:
      - main

env:
  # ---- SDK Configuration ----
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/
  SDK_PREFIX: openwrt-sdk-25.12.5-mediatek-filogic_
  SDK_EXT: tar.zst
  SDK_ARCH: aarch64_cortex-a53
  # ---- QModem Source ----
  QMODEM_REPO: https://github.com/FUjr/QModem.git
  # ---- Build Options ----
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison gawk \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown runner:runner /workdir

      - name: Clone QModem source
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth 1 $QMODEM_REPO qmodem-src
          echo "=== QModem source directory ==="
          ls -la qmodem-src/
          echo "=== Checking for Makefile ==="
          if [ -f qmodem-src/Makefile ]; then
            echo "Makefile found at root"
            head -30 qmodem-src/Makefile
          elif [ -d qmodem-src/qmodem ]; then
            echo "Makefile may be in qmodem/ subdirectory"
            ls -la qmodem-src/qmodem/
          else
            echo "WARNING: No Makefile found, listing all files:"
            find qmodem-src -name "Makefile" -type f
          fi

      - name: Download SDK
        working-directory: /workdir
        run: |
          SDK_FILE=$(curl -sL ${SDK_URL} | grep -oP 'openwrt-sdk-[^"]*\.tar\.zst' | head -1)
          if [ -z "$SDK_FILE" ]; then
            echo "Error: SDK file not found at ${SDK_URL}"
            exit 1
          fi
          echo "Downloading SDK: ${SDK_FILE}"
          wget -q "${SDK_URL}${SDK_FILE}"
          tar --use-compress-program=unzstd -xf "$SDK_FILE"
          SDK_DIR=$(ls -d openwrt-sdk-* | head -1)
          ln -sf /workdir/${SDK_DIR} $GITHUB_WORKSPACE/openwrt-sdk
          echo "SDK_DIR=${SDK_DIR}" >> $GITHUB_ENV

      - name: Link QModem to SDK
        run: |
          # Link QModem source into SDK package directory
          ln -sf /workdir/qmodem-src $GITHUB_WORKSPACE/openwrt-sdk/package/qmodem
          echo "=== Verify link ==="
          ls -la openwrt-sdk/package/qmodem/
          echo "=== Check Makefile ==="
          if [ -f openwrt-sdk/package/qmodem/Makefile ]; then
            echo "OK: package/qmodem/Makefile exists"
          else
            echo "Searching for Makefile in subdirectories..."
            find openwrt-sdk/package/qmodem -name "Makefile" -type f
            # If Makefile is in a subdirectory, relink
            SUBDIR=$(find openwrt-sdk/package/qmodem -name "Makefile" -type f -exec dirname {} \; | head -1)
            if [ -n "$SUBDIR" ]; then
              echo "Found Makefile in: $SUBDIR"
              rm -f openwrt-sdk/package/qmodem
              SUBDIR_NAME=$(basename "$SUBDIR")
              # Find the actual path relative to qmodem-src
              ACTUAL_DIR=$(find /workdir/qmodem-src -name "Makefile" -type f -exec dirname {} \; | head -1)
              if [ -n "$ACTUAL_DIR" ]; then
                ln -sf "$ACTUAL_DIR" openwrt-sdk/package/qmodem
                echo "Relinked to: $ACTUAL_DIR"
                ls -la openwrt-sdk/package/qmodem/
              fi
            fi
          fi

      - name: Load custom feeds
        run: |
          cat > openwrt-sdk/feeds.conf <<EOF
          src-git base https://github.com/openwrt/openwrt.git;openwrt-25.12
          src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
          src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12
          EOF

      - name: Update feeds
        run: cd openwrt-sdk && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt-sdk && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          cat > openwrt-sdk/.config <<EOF
          CONFIG_ALL=y
          CONFIG_ALL_NONSHARED=y
          CONFIG_ALL_KMODS=y
          CONFIG_SIGNED_PACKAGES=n
          EOF
          cd openwrt-sdk
          make defconfig

      - name: Download package
        id: package
        run: |
          cd openwrt-sdk
          make download -j8 || true
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt-sdk
          echo "=== Attempting multi-thread build ==="
          make package/qmodem/compile V=s -j$(nproc) || make package/qmodem/compile V=s -j1
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p firmware
          # Search for APK packages
          find openwrt-sdk/bin/packages/${SDK_ARCH} -name "qmodem*.apk" -exec cp {} firmware/ \; 2>/dev/null || true
          find openwrt-sdk/bin/targets -name "qmodem*.apk" -exec cp {} firmware/ \; 2>/dev/null || true
          # Fallback: also search for IPK packages
          find openwrt-sdk/bin/packages/${SDK_ARCH} -name "qmodem*.ipk" -exec cp {} firmware/ \; 2>/dev/null || true
          cd firmware
          echo "=== Collected files ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: QModem_Cudy_TR3000_${{ steps.compile.outputs.FILE_DATE }}
          path: ${{ steps.organize.outputs.FIRMWARE }}
          retention-days: 7

      - name: Generate Release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/v') && !cancelled()
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          name: QModem ${{ steps.tag.outputs.TAG_NAME }} for Cudy TR3000-v1
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            QModem build for Cudy TR3000-v1
            - Target: mediatek/filogic (MT7981)
            - OpenWrt: 25.12.5
            - Package format: APK
            - Build date: ${{ steps.compile.outputs.FILE_DATE }}
          prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, '-beta') || contains(steps.tag.outputs.TAG_NAME, '-rc') }}
          files: ${{ steps.organize.outputs.FIRMWARE }}/*
