# Description: Build QModem package for OpenWrt 25.12.5 (mediatek/filogic)
# Target: Cudy TR3000-v1
#

name: Build QModem

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/
  SDK_PREFIX: openwrt-sdk-25.12.5-mediatek-filogic_
  SDK_EXT: tar.zst
  SDK_ARCH: aarch64_cortex-a53
  QMODEM_REPO: https://github.com/FUjr/QModem.git
  QMODEM_BRANCH: main
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build QModem
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          echo "====================== Initialization ======================"
          sudo timedatectl set-timezone "$TZ"
          echo "DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "TAG_NAME=$(date '+%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "RELEASE_NAME=QModem-$(date '+%Y%m%d')" >> $GITHUB_ENV
          # Free disk space (do NOT remove apt sources)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -hT

      - name: Installation Dependencies
        run: |
          echo "====================== Install Dependencies ======================"
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison gawk \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          echo "====================== Download SDK ======================"
          SDK_FILE=$(curl -sL ${SDK_URL} | grep -oP 'openwrt-sdk-[0-9]+\.[0-9]+\.[0-9]+-[^"]*\.tar\.zst' | head -1)
          if [ -z "$SDK_FILE" ]; then
            SDK_FILE=$(curl -sL ${SDK_URL} | grep -oP 'openwrt-sdk-[^"]*\.tar\.zst' | head -1)
          fi
          echo "SDK_FILE=$SDK_FILE"
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          wget -q "${SDK_URL}${SDK_FILE}"
          tar --use-compress-program=unzstd -xf "$SDK_FILE"
          SDK_DIR=$(ls -d openwrt-sdk-* | head -1)
          echo "SDK_DIR=$SDK_DIR"
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      - name: Clone QModem Source
        run: |
          echo "====================== Clone QModem ======================"
          git clone --depth 1 -b ${QMODEM_BRANCH} ${QMODEM_REPO} qmodem-src
          echo "QModem cloned successfully"
          ls -la qmodem-src/

      - name: Configure Feeds
        run: |
          echo "====================== Configure Feeds ======================"
          cd $SDK_DIR
          # Register QModem as a feed (this makes ALL sub-packages discoverable)
          cat > feeds.conf <<EOF
          src-git base https://github.com/openwrt/openwrt.git;openwrt-25.12
          src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
          src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12
          src-git qmodem ${QMODEM_REPO};${QMODEM_BRANCH}
          EOF
          echo "feeds.conf:"
          cat feeds.conf
          ./scripts/feeds update -a
          # Install ALL packages from the qmodem feed (application, driver, luci)
          ./scripts/feeds install -a -p qmodem
          echo "=== Installed feeds packages ==="
          ls -la $SDK_DIR/package/feeds/qmodem/ 2>/dev/null || echo "No qmodem feed packages dir"

      - name: Configure Build
        run: |
          echo "====================== Configure Build ======================"
          cd $SDK_DIR
          cat > .config <<EOF
          CONFIG_PACKAGE_qmodem=m
          CONFIG_PACKAGE_luci-app-qmodem-next=m
          CONFIG_SIGNED_PACKAGES=n
          EOF
          make defconfig
          echo "=== .config relevant lines ==="
          grep -i "qmodem\|SIGNED" .config || true

      - name: Compile
        run: |
          echo "====================== Compile QModem ======================"
          cd $SDK_DIR
          # Attempt multi-thread build first, fall back to single thread
          make package/qmodem/compile V=s -j$(nproc) || make package/qmodem/compile V=s -j1
          echo "=== Build completed ==="

      - name: Organize Files
        id: organize
        run: |
          echo "====================== Organize Files ======================"
          mkdir -p $GITHUB_WORKSPACE/firmware
          # Search for built APK packages
          find ${SDK_DIR}/bin/packages/${SDK_ARCH}/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find ${SDK_DIR}/bin/targets/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          # Also check the packages directory structure
          find ${SDK_DIR}/bin/packages/ -name "qmodem*" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          find ${SDK_DIR}/bin/packages/ -name "luci-app-qmodem*" -exec cp {} $GITHUB_WORKSPACE/firmware/ \; 2>/dev/null || true
          cd $GITHUB_WORKSPACE/firmware
          echo "FIRMWARE=$PWD" >> $GITHUB_OUTPUT
          ls -lh
          if [ -z "$(ls -A)" ]; then
            echo "WARNING: No output files found"
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Upload Firmware
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QModem-${{ env.TAG_NAME }}
          path: ${{ steps.organize.outputs.FIRMWARE }}
          retention-days: 7

      - name: Check Space
        if: always()
        run: df -hT
