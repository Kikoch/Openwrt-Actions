#=================================================
# 构建 ImmortalWrt 官方 master 固件 (Nokia XG-040G-MD UBI)
# 与 ponwrt 工作流相互独立:
#   - 源码: immortalwrt/immortalwrt master (官方, 非 ponwrt fork)
#   - 上游已收录本设备 (含 EN8811H 2.5G PHY), 但 DTS 无 PON 节点、
#     设备定义无 PON 包 -> diy 脚本覆盖 DTS + 显式选择 PON 全栈
#   - 实验性质: 若上游 master 与 ponwrt DTS/内核出现不兼容,
#     回退使用 Build PonWrt XG-040G-MD 工作流的固件
#=================================================

name: Build ImmortalWrt XG-040G-MD

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "ImmortalWrt 源码 ref (留空=用默认 pin 的 master 版本)"
        required: false
        default: ""
      release:
        description: "是否创建 Release (yes/no)"
        required: false
        default: "no"
  push:
    branches:
      - main
      - master
    paths:
      - "immortalwrt-extra.config"
      - "immortalwrt-diy-part1.sh"
      - "immortalwrt-diy-part2.sh"
      - "immortalwrt-required-packages.txt"
      - "scripts/verify-firmware.sh"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  # pin 到 2026-09-29 的 master (设备已收录, an7581.mk 含 nokia_xg-040g-md-ubi)
  REPO_REF: bf156b68e3c9829f3e494e458caf97a40413c34c
  CONFIG_FILE: immortalwrt-extra.config
  DIY_P1_SH: immortalwrt-diy-part1.sh
  DIY_P2_SH: immortalwrt-diy-part2.sh
  REQUIRED_PKGS: immortalwrt-required-packages.txt
  # 产物层校验目标
  EXPECT_PROFILE: nokia_xg-040g-md-ubi
  EXPECT_BOARD: nokia,xg-040g-md-ubi
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Free build space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt source code (pinned)
      working-directory: /workdir
      run: |
        df -hT $PWD
        REF="${{ github.event.inputs.source_ref }}"
        [ -z "$REF" ] && REF="$REPO_REF"
        echo "Building from: $REF"
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout -q $REF
        echo "SOURCE_REF=$REF" >> $GITHUB_ENV
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache downloads (dl/)
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        key: imm-xg-dl-${{ hashFiles('immortalwrt-extra.config', 'immortalwrt-diy-part1.sh', 'immortalwrt-diy-part2.sh') }}
        restore-keys: |
          imm-xg-dl-

    - name: Run DIY part1 (feeds + DTS 覆盖)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load configuration (设备选择 + 附加包 + 强校验)
      run: |
        [ -e files ] && mv files openwrt/files
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s || exit 1
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Verify firmware (产物层校验 + 归档)
      id: verify
      env:
        SRC_DIR: openwrt
        EXPECT_PROFILE: ${{ env.EXPECT_PROFILE }}
        EXPECT_BOARD: ${{ env.EXPECT_BOARD }}
        REQUIRED_PKGS: ${{ env.REQUIRED_PKGS }}
        SOURCE_URL: ${{ env.REPO_URL }}
        SOURCE_REF: ${{ env.SOURCE_REF }}
      run: bash scripts/verify-firmware.sh

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled() && steps.verify.outcome == 'success'
      with:
        name: ImmortalWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 3

    - name: Create release
      if: github.event.inputs.release == 'yes' && !cancelled() && steps.verify.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ImmortalWrt_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ImmortalWrt 官方 master 自编译固件 - Nokia XG-040G-MD (UBI)
          源码: immortalwrt/immortalwrt @ ${{ env.SOURCE_REF }}
          特点: 官方上游设备支持 + ponwrt DTS 覆盖 (PON) + PON feed 全栈
          实验性构建; 稳定版请使用 Build PonWrt XG-040G-MD 工作流产物
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
